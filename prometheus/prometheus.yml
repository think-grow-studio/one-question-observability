global:
  scrape_interval: 60s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "one-question-api"
    scheme: http
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["10.0.0.87:8081"]
        labels:
          env: "main"
          vm: "main-vm"
      - targets: ["10.0.0.31:8081"]
        labels:
          env: "sub"
          vm: "sub-vm"

  - job_name: "oracle-db"
    static_configs:
      - targets: ["oracle_exporter_main:9161"]
        labels:
          env: "main"
          component: "oracle"
      - targets: ["oracle_exporter_dev:9161"]
        labels:
          env: "dev"
          component: "oracle"
