version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    init: true
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # 1GB용: 오래 보관하지 말고 가볍게 (기본 3일)
      - "--storage.tsdb.retention.time=${RETENTION_TIME:-3d}"
      # 1GB용: 무거운 쿼리 제한
      - "--query.max-concurrency=4"
      - "--query.timeout=30s"
    mem_limit: 450m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    init: true
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 300m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # 모니터링 VM(자기 자신) 리소스 수집용
  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: unless-stopped
    init: true
    ports:
      - "9100:9100"
    mem_limit: 50m
    cpus: 0.08
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  # Oracle DB exporter (main) - Autonomous DB Wallet 지원
  # 사전준비: oracle/wallet/main/ 에 Wallet zip 풀어놓기
  oracle_exporter_main:
    image: container-registry.oracle.com/database/observability-exporter:2.2.2
    container_name: oracle_exporter_main
    restart: unless-stopped
    init: true
    ports:
      - "9161:9161"
    environment:
      - DB_USERNAME=${ORACLE_MAIN_USER}
      - DB_PASSWORD=${ORACLE_MAIN_PASSWORD}
      - DB_CONNECT_STRING=${ORACLE_MAIN_TNS}
      - TNS_ADMIN=/wallet
    volumes:
      - ./oracle/wallet/main:/wallet:ro
    mem_limit: 64m
    cpus: 0.10
    logging:
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  prom_data:
  grafana_data:
